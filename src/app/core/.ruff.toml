# 이 규칙 하나가 레이어 역전을 실제로 막는다. 컨벤션 문서가 아니라 import 그래프로
# 강제되므로 어겼을 때 눈에 띈다. ruff 는 린트 대상 파일에서 가장 가까운 설정을 쓰므로,
# 이 파일은 core/ 아래에만 적용된다.
