services:
  auth:
    image: alpine:3.21
    volumes:
      - ${CODEX_HOME:-${USERPROFILE:-${HOME:-/nonexistent}}/.codex}:/host-codex:ro
      - ./.secrets/codex:/secrets
      - ./scripts/sync-credentials.sh:/sync.sh:ro
    entrypoint: ["/bin/sh", "/sync.sh"]
    restart: "no"

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  vector-store:
    image: chromadb/chroma:1.5.9
    volumes:
      # 프로젝트 루트의 ./data/chroma를
      # 컨테이너 내부 /data에 연결한다.
      - ./data/chroma:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  vector-store-ui:
    # Chroma 1.5.9 서버는 자체 UI 가 없다(루트 경로가 404). 비공식 admin UI 를 붙인다.
    # 이미지가 arm64 전용이라 평가자 환경(amd64)에서 `docker compose up` 이 깨질 수
    # 있다. 프로필로 격리해 기본 기동에서는 아예 뜨지 않게 한다 — `--profile gui`.
    profiles: ["gui"]
    image: fengzhichao/chromadb-admin:0.0.2
    ports:
      - "3001:3001"
    depends_on:
      vector-store:
        condition: service_healthy
    # 볼륨 없음. 접속 설정은 브라우저 localStorage 에만 남고 컨테이너는 상태가 없다.
    # 벡터 데이터도 파일이 아니라 HTTP(v2 API)로 읽으므로 ./data 를 붙일 필요가 없다.
    restart: unless-stopped

  api:
    build:
      context: .
      # 스테이지가 여럿이라 명시한다 — `--target` 이 없으면 마지막(`test`) 스테이지가
      # 뽑혀, 서비스 이미지에 테스트와 개발 의존성이 딸려 들어간다.
      target: runtime
    command:
      - uvicorn
      - --factory
      - app.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    environment:
      APP_CACHE_URL: redis://cache:6379/0
      APP_VECTOR_STORE_URL: http://vector-store:8000
      APP_REGISTRY_PATH: /data/registry.sqlite3
    ports:
      - "8000:8000"
    volumes:
      # 프로젝트 루트의 ./data/registry를
      # 컨테이너 내부 /data에 연결한다.
      - ./data/registry:/data
      - ./.secrets/codex:/home/app/.codex
    depends_on:
      auth:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      vector-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  test:
    # 기본 기동(`docker compose up`)에 딸려 오지 않게 프로필 뒤에 둔다.
    # `docker compose run` 은 프로필과 무관하게 이 서비스를 집어낸다.
    #
    # ── 소스 볼륨 마운트가 **없는** 이유 ──────────────────────────────────
    #
    # 코드는 빌드 때 이미지에 구워진다. 따라서 `--build` 없는 `docker compose run` 은
    # 직전 이미지의 코드를 검사하고, 방금 고친 결함을 그대로 다시 보고한다.
    # 실제로 이 함정에 빠져 시간을 태운 적이 있어(`retros/2026-08-03_1741_retro.md`)
    # 여기에 이유를 적어 둔다 — **검증은 언제나 `--build` 와 함께 돈다.**
    #
    # `- ./src:/app/src` 를 붙이지 않는 것은 그게 **듣지 않기 때문**이다.
    # `Dockerfile` 이 `COPY src` 뒤에 `pip install .`(편집 가능 설치가 아니다)를 하므로
    # `app` 패키지는 site-packages 에 있다. `/app/src` 를 덮어써도 import 되는 코드는
    # 그대로다. 반대로 `- ./tests:/app/tests` 는 듣는다 — 그래서 더 나쁘다.
    # 테스트 수정만 반영되고 소스 수정은 무시되는 상태가 되어, 초록/빨강이 어느 세대
    # 코드의 것인지 알 수 없어진다. **반쪽만 듣는 마운트보다 없는 편이 낫다.**
    #
    # 편집 가능 설치(`pip install -e .`)로 바꾸면 마운트가 온전히 듣지만, 그때는
    # 런타임 이미지가 배포되는 모양과 달라진다(`test` 스테이지는 `runtime` 을 덧쌓는다).
    # 평가자는 `--build` 를 한 번 돌리므로 이 구성에서 잃는 것이 없다.
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      # 컨테이너 안에서 `localhost:8001` 은 벡터 스토어가 아니다. 서비스 이름으로 만난다.
      APP_VECTOR_STORE_URL: http://vector-store:8000
    depends_on:
      vector-store:
        condition: service_healthy
