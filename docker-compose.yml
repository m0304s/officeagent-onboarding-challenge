services:
  cache:
    image: redis:7-alpine
    # 캐시가 늦게 뜨는 동안 API 가 503 을 내면 헬스체크와 얽혀 재시작 루프가 된다.
    # 캐시 쪽에 자체 헬스체크를 걸어 API 가 그 뒤에 뜨게 한다 (design 결정 4).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    # 워커 1개로 고정한다. 벡터 스토어를 임베디드 퍼시스턴트 모드로 쓰므로 여러 프로세스가
    # 같은 파일을 잡으면 락이 충돌한다 (design 결정 3). 늘리려면 벡터 스토어를 별도
    # 서비스로 분리하는 결정이 먼저다.
    command:
      - uvicorn
      - --factory
      - app.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    environment:
      APP_CACHE_URL: redis://cache:6379/0
      APP_VECTOR_STORE_PATH: /data/chroma
    ports:
      - "8000:8000"
    volumes:
      - vector-store:/data/chroma
      # 호스트 자격증명의 **사본**. 만료 시 CLI 가 갱신을 시도하므로 쓰기 가능하게 붙인다.
      # `:ro` 로 붙이면 access token 수명(실측 약 8시간)이 끝나는 순간 인증이 끊긴다.
      # 디렉터리는 scripts/sync-credentials.sh 가 미리 만든다 (`make up` 이 먼저 호출).
      - ./.secrets/claude:/home/app/.claude
    # 호스트 UID 가 1000 이 아닌 리눅스에서 마운트한 자격증명을 컨테이너가 읽지 못하면
    # 아래 줄의 주석을 풀면 된다. macOS(Docker Desktop)는 소유권을 매핑해 주므로 불필요.
    # user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # 기동 유예. 이 시간 안의 실패는 재시도로 흡수된다.
      start_period: 30s
    restart: unless-stopped

volumes:
  vector-store:
