services:
  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  vector-store:
    image: chromadb/chroma:1.5.9
    volumes:
      # 프로젝트 루트의 ./data/chroma를
      # 컨테이너 내부 /data에 연결한다.
      - ./data/chroma:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  vector-store-ui:
    # Chroma 1.5.9 서버는 자체 UI 가 없다(루트 경로가 404). 비공식 admin UI 를 붙인다.
    # 이미지가 arm64 전용이라 평가자 환경(amd64)에서 `docker compose up` 이 깨질 수
    # 있다. 프로필로 격리해 기본 기동에서는 아예 뜨지 않게 한다 — `--profile gui`.
    profiles: ["gui"]
    image: fengzhichao/chromadb-admin:0.0.2
    ports:
      - "3001:3001"
    depends_on:
      vector-store:
        condition: service_healthy
    # 볼륨 없음. 접속 설정은 브라우저 localStorage 에만 남고 컨테이너는 상태가 없다.
    # 벡터 데이터도 파일이 아니라 HTTP(v2 API)로 읽으므로 ./data 를 붙일 필요가 없다.
    restart: unless-stopped

  api:
    build: .
    command:
      - uvicorn
      - --factory
      - app.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    environment:
      APP_CACHE_URL: redis://cache:6379/0
      APP_VECTOR_STORE_URL: http://vector-store:8000
      APP_REGISTRY_PATH: /data/registry.sqlite3
    ports:
      - "8000:8000"
    volumes:
      # 프로젝트 루트의 ./data/registry를
      # 컨테이너 내부 /data에 연결한다.
      - ./data/registry:/data
      - ./.secrets/claude:/home/app/.claude
    depends_on:
      cache:
        condition: service_healthy
      vector-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
