[project]
name = "document-qa-api"
version = "0.1.0"
description = "문서 근거 기반 답변을 생성하는 RAG Document Q&A API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # multipart 업로드 파싱. FastAPI 가 선택 의존성으로 두므로 명시한다.
    "python-multipart>=0.0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # `CapacityLimiter` 를 직접 쓴다. starlette 경유 전이 의존에 맡기면 상위가 떼는 순간 깨진다.
    "anyio>=4",
    # 서버 모드로 쓰므로 클라이언트와 서버 이미지(docker-compose.yml)의 버전을 맞춘다.
    # 어긋나면 HTTP API 경로(v1/v2)나 응답 형식이 달라져, 기동은 되는데 첫 쓰기에서 터진다.
    "chromadb==1.5.9",
    # 6.0 이 벡터셋 명령의 하한이다. 그 아래에서는 헬퍼가 없어 `execute_command` 로
    # 내려가는데, 그러면 바이너리 벡터 인자를 우리가 직접 조립하게 된다.
    "redis>=6.0",
    # 로컬 임베딩. torch 를 끌고 오므로 이미지에서는 CPU 전용 휠로 설치한다.
    "sentence-transformers>=3.0",
    # PDF 텍스트 추출. AGPL-3.0 — 상용 배포로 가려면 pypdf(BSD) 교체가 선행되어야 한다.
    # 추출 결과가 저장물이고 저장물이 index_signature 의 축이라, 버전이 흔들리면 같은
    # 설정에서 같은 PDF 가 다른 청크가 된다. chromadb 와 같은 이유로 정확 고정한다.
    # pymupdf4llm 1.28.0 이 pymupdf==1.28.0 을 정확히 요구하므로 두 값이 함께 움직인다.
    "pymupdf==1.28.0",
    "pymupdf4llm==1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    # 자격증명이 컨테이너에 붙는 경로는 파이썬이 아니라 docker-compose.yml 에만 적혀 있다.
    # 그 계약을 테스트가 읽어 단언하려면 파서가 필요하다 (tests/test_boot.py).
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ── ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"
# 계획 산출물은 소스가 아니다. ruff 가 마크다운 안의 예시 코드 블록까지 포매팅하면
# 설계 문서가 린터의 취향대로 바뀐다.
extend-exclude = ["openspec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

# 설정은 app.config 를 단일 창구로 삼는다 (design 결정 8).
# 여기를 우회한 직접 조회를 린트로 막는다 — 컨벤션이 아니라 도구로 강제.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "환경변수는 app.config.Settings 를 통해서만 읽는다"
"os.getenv".msg = "환경변수는 app.config.Settings 를 통해서만 읽는다"

[tool.ruff.lint.per-file-ignores]
# config.py 가 유일하게 환경을 직접 읽는 곳이다.
"src/app/config.py" = ["TID251"]
# 테스트는 환경을 조작해 설정 로딩 자체를 검증해야 한다.
"tests/*" = ["TID251"]

# ── pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# 실물 CLI 층과 실물 Redis 층은 기본 실행에서 뺀다 — 한 줄이 구독·저장소에 묶이면 안 된다.
# 골든셋 비교도 같은 이유로 뺀다. 평가자가 도는 한 줄이 30분을 넘으면 실행 용이성이 깨진다.
# 돌리려면 `pytest -m llm` / `-m redis` / `-m slow` (README "테스트").
addopts = ["-m", "not llm and not redis and not slow"]
markers = [
    "llm: 실물 codex CLI 를 부르는 테스트 (구독 필요, 기본 실행 제외)",
    "redis: 실물 Redis 를 쓰는 캐시 계약 테스트 (저장소 필요, 기본 실행 제외)",
    "slow: 골든셋을 두 구성으로 돌리는 비교 — 순위는 `-m slow`, 생성 채점은 `-m \"llm and slow\"` (기본 실행 제외)",
]
