[project]
name = "document-qa-api"
version = "0.1.0"
description = "문서 근거 기반 답변을 생성하는 RAG Document Q&A API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # multipart 업로드 파싱. FastAPI 가 선택 의존성으로 두므로 명시한다.
    "python-multipart>=0.0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "chromadb>=0.5",
    "redis>=5.2",
    # 로컬 임베딩. torch 를 끌고 오므로 이미지에서는 CPU 전용 휠로 설치한다.
    "sentence-transformers>=3.0",
    # PDF 텍스트 추출. AGPL-3.0 — 상용 배포로 가려면 pypdf(BSD) 교체가 선행되어야 한다.
    # 교체 범위는 adapters/parsers/pdf.py 한 파일이다 (ARCHITECTURE.md "문서 파서").
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ── ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"
# 계획 산출물은 소스가 아니다. ruff 가 마크다운 안의 예시 코드 블록까지 포매팅하면
# 설계 문서가 린터의 취향대로 바뀐다.
extend-exclude = ["openspec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

# 설정은 app.config 를 단일 창구로 삼는다 (design 결정 8).
# 여기를 우회한 직접 조회를 린트로 막는다 — 컨벤션이 아니라 도구로 강제.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "환경변수는 app.config.Settings 를 통해서만 읽는다"
"os.getenv".msg = "환경변수는 app.config.Settings 를 통해서만 읽는다"

[tool.ruff.lint.per-file-ignores]
# config.py 가 유일하게 환경을 직접 읽는 곳이다.
"src/app/config.py" = ["TID251"]
# 테스트는 환경을 조작해 설정 로딩 자체를 검증해야 한다.
"tests/*" = ["TID251"]

# ── pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
