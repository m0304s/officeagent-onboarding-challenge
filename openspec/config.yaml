schema: spec-driven

context: |
  # 프로젝트 컨텍스트

  ## 목적

  문서를 업로드하면 텍스트를 추출·색인하고, 사용자 질문에 대해 **업로드된 문서만을 근거로**
  답변을 생성하는 RAG 기반 Document Q&A REST API 서버.

  OfficeAgent BE 채용 과제(`docs/PRD.md`)의 구현체다. 제품이 아니라 평가 대상 산출물이므로
  **기능 완성도보다 설계 의도와 구현 품질이 우선**이며, 미구현 영역은 설계 문서로 대체할 수 있다.
  단 아래 "불합격 기준"은 예외 없이 지킨다.

  기준 문서는 `docs/PRD.md`다. 이 컨텍스트와 PRD가 어긋나면 PRD가 우선한다.

  ## 제공해야 할 능력

  1. **Ingestion** — 문서 업로드 → 텍스트 추출 → 청킹 → 임베딩 → 벡터 저장. 최소 2개 포맷(PDF, TXT/MD).
  2. **Query & Answer** — 벡터 검색으로 근거 청크를 찾고 LLM으로 답변 생성.
     출처 표기 필수, SSE 스트리밍 필수, 근거 없는 질문은 환각 없이 거절.
  3. **LLM 응답 캐싱** — 동일/유사 질문 재호출 회피, 캐시 히트 여부를 응답에 노출,
     문서 변경 시 관련 캐시 무효화.
  4. **프롬프트 설계** — 설계 의도와 전략을 `PROMPT_DESIGN.md`에 문서화.
  5. **자동화 테스트** — ingestion · retrieval · 캐시 무효화 3경로 커버, 한 줄 명령으로 실행.

  ## 기술 스택

  | 계층 | 선택 | 이유 |
  |------|------|------|
  | 언어 | Python 3.11+ | PRD 고정 조건 |
  | 웹 프레임워크 | FastAPI | PRD 고정 조건. SSE(StreamingResponse)와 async 파이프라인이 네이티브 |
  | LLM SDK | **Codex CLI** (`@openai/codex`) | PRD가 제시한 두 SDK 중 택 1. API 키 없이 구독으로 동작한다. `claude-code-sdk`에서 **갈아탔다** — 자격증명이 세 OS 모두 평문 파일이라 컨테이너가 볼륨으로 읽을 수 있고, macOS Keychain에 있는 쪽은 `docker compose up` 한 줄에 인증을 넣을 방법이 없었다 (근거는 `ARCHITECTURE.md` "LLM SDK 통합 방식") |
  | 임베딩 | sentence-transformers (로컬) | 로컬 오픈소스 모델이라 테스트가 LLM 구독 없이 실행된다(PRD 가산점). 임베딩이 네트워크·과금에 묶이지 않아 ingestion/retrieval 테스트를 실물로 돌릴 수 있음 |
  | 벡터 DB | Chroma (서버 모드, 별도 컨테이너) | 메타데이터 필터와 문서 단위 삭제를 지원해 리비전 교체·캐시 무효화 연동이 가능. 저장소를 앱 프로세스 밖으로 빼 API 재배포와 수명이 분리됨 (임베디드 퍼시스턴트에서 전환 — 근거는 `ARCHITECTURE.md`) |
  | 캐시 DB | Redis | 정확 매치는 키 조회, 유사 질문은 질문 임베딩 유사도로 판정. TTL·태그 기반 무효화가 자연스럽고 캐시 계층이 저장소 수준에서 분리됨 |
  | 실행 | Docker Compose | `docker compose up` 한 줄 실행 (PRD 조건) |
  | 테스트 | pytest | 한 줄 실행 (PRD 조건). LLM 호출은 목/스텁으로 대체 |

  기술 선택을 바꾸면 이 표와 `ARCHITECTURE.md`·`README.md`를 함께 고치고 **바꾼 이유를 남긴다**
  (PRD상 가산점). 문서와 구현의 불일치는 감점, 없는 기능을 있다고 적으면 불합격이다.

  ## 아키텍처 규약

  레이어 분리를 명시적으로 유지한다. 상위 레이어는 하위 레이어의 인터페이스만 알고 구현체는 모른다.

      api/        FastAPI 라우터 — HTTP 관심사(검증, 상태 코드, SSE 이벤트 포맷)만
      services/   유스케이스 오케스트레이션 — ingestion, qa, cache invalidation
      core/       도메인 로직 — 청킹 전략, 프롬프트 구성, 인용 조립
      adapters/   외부 의존성 경계 — LLM 클라이언트, 벡터 스토어, 캐시 스토어, 파일 파서

  - **adapters는 프로토콜(인터페이스) 뒤에 둔다.** 테스트에서 LLM 어댑터를 스텁으로 갈아끼우기 위한
    최소 조건이고, 기술 선택이 바뀌어도 상위 레이어가 흔들리지 않는다.
  - **에러 핸들링은 레이어 경계에서.** 도메인 예외를 정의하고 API 레이어에서만 HTTP 상태 코드로
    변환한다. 어댑터의 예외(파싱 실패, LLM 타임아웃)가 라우터까지 그대로 새지 않게 한다.
  - **LLM 호출에는 timeout과 retry를 반드시 건다.** 재시도는 지수 백오프, 재시도 불가 오류는 즉시 실패.
  - **스트리밍이 1급 경로다.** 답변을 전부 모은 뒤 반환하는 방식만 두면 감점.
    비스트리밍 엔드포인트는 선택적으로 함께 둔다.
  - **비동기가 기본.** I/O(파일, LLM, Redis, 벡터 DB)는 async, CPU 바운드 작업(임베딩 인코딩, PDF 파싱)은
    스레드풀로 오프로드해 이벤트 루프를 막지 않는다.

  ## 코드 스타일

  - PEP 8 + 타입 힌트. 포매팅·린팅은 `ruff` 단일 도구로 통일.
  - 공개 함수·클래스에는 docstring, 내부 헬퍼는 이름으로 설명. 주석은 "왜"를 적고 "무엇"은 적지 않는다.
  - 도메인 용어는 코드·문서·API에서 같은 단어를 쓴다:
    `document`, `chunk`, `embedding`, `retrieval`, `citation`, `cache_hit`.

  ## 테스트 전략

  핵심 3경로를 반드시 덮는다. 커버리지 수치는 평가하지 않으며 **무엇을 왜 테스트했는지**가 기준이다.

  | 경로 | 검증 대상 |
  |------|----------|
  | Ingestion | 파일 업로드 → 텍스트 추출 → 청킹 → 저장까지 성공하는가 (PDF·TXT 각각) |
  | Retrieval | 질의에 대해 기대한 청크/문서가 상위에 검색되는가 |
  | 캐시 무효화 | 문서 변경(추가·삭제·재업로드) 후 관련 캐시가 실제로 무효화되는가 |

  - **LLM 호출은 목/스텁으로 대체한다.** 전체 스위트가 구독 없이 `pytest` 한 줄로 통과해야 한다.
    실물 CLI를 부르는 층은 `llm` 마커 뒤에 두어 기본 실행에서 빠진다(`pytest -m llm` 으로만 돈다).
  - 임베딩은 로컬 모델이므로 목이 아니라 실물로 돌린다. retrieval 테스트가 실제 검색 품질을 검증하게 한다.
  - 테스트 문서는 `sample-docs/`를 쓰고, 픽스처는 격리된 임시 벡터 스토어·캐시를 사용해
    실행 순서에 의존하지 않게 한다.
  - 실행 명령을 `README.md`에 한 줄로 명시한다.

  ## Git 워크플로

  - `main` + 목적이 드러나는 토픽 브랜치(예: `spec-definition`).
  - **작업한 날은 하루 1회 이상 커밋·push.** Retrobot이 커밋 시점의 작업 로그로 회고를 생성하므로,
    며칠 치를 한 번에 커밋하면 시도·폐기·전환 과정이 기록되지 않는다. 미완성 커밋도 괜찮다.
  - 커밋 메시지에 "Retrobot"이 포함되면 post-commit 훅이 스킵된다(무한 루프 방지).
  - 훅 활성화: `git config core.hooksPath .githooks`.
  - 한 커밋에 한 관심사.

  ## 도메인 용어

  코드·문서·API에서 아래 용어를 일관되게 쓴다: RAG, 청크(chunk), 임베딩(embedding),
  검색(retrieval), 출처(citation), 환각 억제, 유사 질문 캐싱, 캐시 무효화, 캐시 히트(cache_hit).

  샘플 문서 (`sample-docs/`):
  - `company-policy.txt` — 사내 복리후생 안내 (교육비, 재택근무, 연차 등)
  - `development-guide.md` — 개발 가이드 (코드 리뷰, 브랜치 전략, 배포 프로세스)

  ## 제약

  ### 불합격 기준 (설계·구현이 항상 지켜야 할 선. 전체 목록은 PRD 참조)

  - 명시된 방법으로 **실행 불가** — 평가자가 README 절차를 1회 수행해 확인한다
  - **벡터 검색 또는 캐시 DB 미구현**
  - **문서에 구현했다고 적었으나 해당 코드가 없음** (허위 기재)

  ### 필수 산출물

  | 파일 | 내용 |
  |------|------|
  | `README.md` | 실행 방법 + 테스트 실행 방법 + 기술 선택 이유 |
  | `ARCHITECTURE.md` | 기술 스택 선택 이유, LLM SDK 통합 방식 |
  | `PROMPT_DESIGN.md` | 프롬프트 설계 의도와 전략 |
  | `tests/` | 핵심 3경로 자동화 테스트 |
  | `retros/` | Retrobot 자동 생성 회고 |

  ## 외부 의존성

  | 의존성 | 용도 | 비고 |
  |--------|------|------|
  | Codex CLI (`@openai/codex`, 이미지에 설치) | LLM 답변 생성 | API 키 불필요, 구독 기반. 파이썬 SDK가 없어 `codex app-server` 프로세스를 띄우고 stdio 위의 JSON-RPC로 대화한다 — 프로세스 수명·타임아웃·재시도가 우리 몫이다 |
  | `sentence-transformers` | 문서·질문 임베딩 | 로컬 실행. 최초 실행 시 모델 다운로드 — Docker 빌드 단계에서 미리 받아 첫 요청 지연을 없앤다 |
  | Chroma | 벡터 저장·검색 | 서버 모드(`chromadb/chroma`, compose 서비스), 볼륨 마운트로 영속화. 클라이언트와 서버 버전을 맞춘다 |
  | Redis | LLM 응답 캐시 | Docker Compose 서비스로 기동 |
  | PDF 파서 (PyMuPDF) | PDF 텍스트 추출 | AGPL-3.0. 교체 지점은 `adapters/parsers/pdf.py` 한 파일 |
  | pytest | 테스트 러너 | LLM 어댑터는 스텁으로 대체, 구독 없이 실행 가능해야 함 |

  런타임 전제:
  - 평가자 환경에서 `docker compose up` 한 줄로 기동되어야 한다.
  - Codex CLI는 구독 인증에 의존하므로, **인증이 없는 환경에서도 서버가 기동되고 테스트가
    통과**해야 한다. 인증 부재는 QA 요청 시점의 명확한 에러(`llm_unauthenticated`)로 드러나야 하며,
    부팅 실패나 테스트 실패로 이어져서는 안 된다.

  ## 참고 문서

  - `docs/PRD.md` — 과제 원문 (최우선 기준)
  - `CLAUDE.md` / `AGENTS.md` — AI 에이전트용 리포 가이드 (심볼릭 링크로 동일 내용)
  - `retrobot/SKILL.md` — 자동 회고 생성 지침

rules:
  proposal:
    - 각 변경은 PRD의 어느 요구사항(§1 Ingestion / §2 Query & Answer / §3 캐싱 / §4 프롬프트 / §5 테스트)을 충족하는지 명시한다.
    - 완성도보다 설계 의도가 평가 대상이므로, 범위를 넓히는 대신 의도를 분명히 한다.

  specs:
    - 스펙은 관측 가능한 동작만 기술한다. 라이브러리 이름(Chroma, Redis, Codex CLI)이나 내부 함수명은 design.md로 보낸다.
    - QA 관련 스펙에는 스트리밍 동작, 출처 표기 형태, 근거가 없을 때의 거절 동작을 각각 시나리오로 둔다.
    - 캐시 관련 스펙에는 정확 매치 히트, 유사 질문 히트, 문서 변경 후 무효화를 각각 시나리오로 둔다.
    - 에러 경로를 빠뜨리지 않는다 - 지원하지 않는 파일 포맷, 빈 문서, LLM 타임아웃, 벡터 검색 결과 없음.

  design:
    - 기술 선택에는 반드시 이유를 적는다. PRD가 선택 이유의 문서화를 요구하며, 여기 적은 내용이 `ARCHITECTURE.md`의 근거가 된다.
    - 레이어 분리(api / services / core / adapters)를 어떻게 지키는지, 어댑터 인터페이스가 무엇인지 명시한다.
    - LLM 호출 설계는 스트리밍·timeout·retry·구조화 출력을 모두 다룬다.
    - 캐시 설계는 키 구성, 유사도 판정 기준, 무효화 시 캐시-문서 의존 관계 추적 방식을 구체적으로 적는다.
    - 이미 확정된 스택(Python 3.11+/FastAPI/Codex CLI/sentence-transformers/Chroma/Redis)을 바꾸는 설계라면, 바꾼 이유를 남기고 `ARCHITECTURE.md`·`README.md`도 같이 고치도록 tasks에 넣는다.

  tasks:
    - 구현 태스크에는 대응하는 테스트 태스크를 함께 둔다. 핵심 3경로(ingestion·retrieval·캐시 무효화)를 건드리는 변경은 테스트가 선택이 아니다.
    - 문서(`README.md`·`ARCHITECTURE.md`·`PROMPT_DESIGN.md`)를 갱신하는 태스크를 마지막이 아니라 해당 구현 태스크 바로 뒤에 둔다. 문서-코드 불일치는 감점, 허위 기재는 불합격이다.
    - 하루 1회 이상 커밋할 수 있도록 태스크를 쪼갠다. Retrobot 회고가 AI 협업 과정의 평가 사료다.
